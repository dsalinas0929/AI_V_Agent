[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-v"
version = "0.2.0"
description = "A small CLI agent with a shared reasoning server and local tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<17",
  "google-genai>=1.0,<2", "typer>=0.15,<1", "rich>=13,<15",
  "prompt-toolkit>=3.0,<4", "httpx>=0.28,<1",
]

[project.scripts]
agent-v = "agent_v.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

# Explicit source archive allowlist: never package local credentials or server databases.
[tool.hatch.build.targets.sdist]
include = ["src/agent_v", "tests", "scripts", "release", "README.md", "INSTALL.md",
           "RELEASING.md", "pyproject.toml", "uv.lock", ".env.example"]
